# CMake workflow (single platform) — hardened version
# Based on the official starter: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:            # allow manual runs from the Actions tab

# Least privilege: GITHUB_TOKEN can only READ the repository
permissions:
  contents: read

# Cancel older runs of the same branch/PR when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release           # Release, Debug, RelWithDebInfo, MinSizeRel

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20         # prevent hung jobs from burning minutes

    steps:
      # Recommended: pin to the full commit SHA (e.g. actions/checkout@<sha> # v4.x.x)
      # and let Dependabot keep it updated. Tools like "pinact" or "ratchet" automate this.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # do not leave the token stored in .git/config

      - name: Configure CMake
        run: >
          cmake -B "${{ github.workspace }}/build"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        # --output-on-failure: print the log of any failing test
        # --no-tests=error: fail the job if no tests are registered (avoids a "false green")
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --no-tests=error
