# Configuration for the issue template chooser in DNAPass Password Generator.
# Disables blank issues to ensure users select a template.
# Issue templates (bug_report.md, issue_template.md) are discovered automatically
# from their YAML front matter; this file only adds contact links.

blank_issues_enabled: false
contact_links:
  - name: Security Vulnerability (private report)
    url: https://github.com/gerivanc/dnapass-password-generator/blob/main/SECURITY.md
    about: Do not open a public issue for security problems. Follow the security policy to report them privately.
  - name: General Questions or Support
    url: mailto:dean-grumbly-plop@duck.com
    about: Contact the maintainer for questions or support.
